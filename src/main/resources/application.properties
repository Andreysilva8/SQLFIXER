# Configuração da Porta do Servidor Web
server.port=8081

# URL de conexão apontando para o MySQL do XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/db_mysqlfixer?createDatabaseIfNotExist=true
spring.datasource.username=root
# No XAMPP a senha padrão é VAZIA (não coloque espaços, deixe em branco)
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do Hibernate para criar as tabelas sozinho
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.datasource.hikari.initialization-fail-timeout=0
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration