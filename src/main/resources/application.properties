# Porta do servidor web
server.port=8081

# Banco usado pelo cadastro/login da propria aplicacao.
# Configure as variaveis MYSQLFIXER_APP_DB_URL, MYSQLFIXER_APP_DB_USER e MYSQLFIXER_APP_DB_PASSWORD se precisar.
spring.datasource.url=${MYSQLFIXER_APP_DB_URL:jdbc:mysql://localhost:3306/db_mysqlfixer?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQLFIXER_APP_DB_USER:root}
spring.datasource.password=${MYSQLFIXER_APP_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=2500
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.initialization-fail-timeout=0

# O app sobe mesmo quando o MySQL local ainda nao esta ativo.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
logging.level.org.hibernate.orm.deprecation=error
